app = "kp-videograb-dl"
primary_region = "sin"

[build]

[env]
  PORT = "3000"
  PUBLIC_BASE_URL = "https://kp-videograb-dl.fly.dev"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
